# Production stack. Deployed to /opt/psc-archiver on the VPS and driven by
# scripts/deploy.sh — do not run `docker compose` here by hand except to
# inspect state.
#
# One public hostname, one origin: Traefik terminates TLS and routes to the web
# container, which serves the SPA and proxies /api to the api container over
# the internal network. The api is never routed directly, so there is no CORS
# in production and only one certificate.

# docker compose -f compose.prod.yml -p psc-archiver up -d


name: psc-archiver

services:
  api:
    # Resolved from .env, which deploy.sh rewrites on every deploy. Never
    # `:latest` — pinning the tag is what makes rollback a one-liner.
    image: ${API_IMAGE:-ghcr.io/mroshan74/psc-archiver-api}:${API_TAG:?API_TAG is not set in .env}
    container_name: psc-archiver-api
    restart: unless-stopped
    env_file:
      - .env
    # No `ports:` on purpose. Traefik and nginx both reach this container over
    # the shared network; publishing a host port would expose the API on the
    # public IP over plain HTTP, bypassing TLS.
    volumes:
      # OpenAI batch jobs run for minutes to 24h and their artefacts must
      # survive a restart for the result import to work.
      - ai_tagging_jobs:/app/data/jobs/ai-tagging
    healthcheck:
      # readyz, not healthz: a process that is up but cannot reach Mongo is not
      # a deploy that worked. Alpine ships BusyBox wget, which exits non-zero on
      # the 503 readyz returns when the connection is down.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Nest boot plus the initial Mongo connection. Failures inside this window
      # do not count toward `retries` and do not mark the container unhealthy.
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=false"

  web:
    image: ${WEB_IMAGE:-ghcr.io/mroshan74/psc-archiver-web}:${WEB_TAG:?WEB_TAG is not set in .env}
    container_name: psc-archiver-web
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      # nginx's own static /healthz, not /api/readyz — this reports the web
      # tier, and must not go red merely because the api is down.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.archiver.rule=Host(`${APP_HOST:?APP_HOST is not set in .env}`)"
      - "traefik.http.routers.archiver.entrypoints=websecure"
      - "traefik.http.routers.archiver.tls.certresolver=letsencrypt"
      # Traefik can infer this from EXPOSE, but stating it removes the guess.
      - "traefik.http.services.archiver.loadbalancer.server.port=80"

volumes:
  ai_tagging_jobs:
    name: psc-archiver-ai-tagging-jobs

networks:
  # Created and owned by the Traefik stack (compose.traefik.yml), which must
  # therefore be up before this one. Nothing creates it imperatively.
  traefik_proxy:
    external: true
