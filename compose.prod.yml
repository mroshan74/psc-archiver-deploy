# Production stack. Deployed to /opt/psc-archiver on the VPS and driven by
# scripts/deploy.sh — do not run `docker compose` here by hand except to
# inspect state.
#
# Two public hostnames, each its own origin: Traefik terminates TLS and routes
# ADMIN_HOST to `web` (the staff back office) and LEARNER_HOST to `learner` (the
# learner app). Each container serves its own SPA and proxies /api to the shared
# api container over the internal network. The api is never routed directly, so
# there is no CORS in production — but there are now two certificates, and both
# hostnames must resolve to this server before their first deploy.

# docker compose -f compose.prod.yml -p psc-archiver up -d


name: psc-archiver

services:
  api:
    # Resolved from .env, which deploy.sh rewrites on every deploy. Never
    # `:latest` — pinning the tag is what makes rollback a one-liner.
    image: ${API_IMAGE:-ghcr.io/mroshan74/psc-archiver-api}:${API_TAG:?API_TAG is not set in .env}
    container_name: psc-archiver-api
    restart: unless-stopped
    env_file:
      - .env
    # No `ports:` on purpose. Traefik and nginx both reach this container over
    # the shared network; publishing a host port would expose the API on the
    # public IP over plain HTTP, bypassing TLS.
    volumes:
      # OpenAI batch jobs run for minutes to 24h and their artefacts must
      # survive a restart for the result import to work.
      - ai_tagging_jobs:/app/data/jobs/ai-tagging
    healthcheck:
      # readyz, not healthz: a process that is up but cannot reach Mongo is not
      # a deploy that worked. Alpine ships BusyBox wget, which exits non-zero on
      # the 503 readyz returns when the connection is down.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Nest boot plus the initial Mongo connection. Failures inside this window
      # do not count toward `retries` and do not mark the container unhealthy.
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=false"

  web:
    image: ${WEB_IMAGE:-ghcr.io/mroshan74/psc-archiver-web}:${WEB_TAG:?WEB_TAG is not set in .env}
    container_name: psc-archiver-web
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      # nginx's own static /healthz, not /api/readyz — this reports the web
      # tier, and must not go red merely because the api is down.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.archiver.rule=Host(`${ADMIN_HOST:?ADMIN_HOST is not set in .env}`)"
      - "traefik.http.routers.archiver.entrypoints=websecure"
      - "traefik.http.routers.archiver.tls.certresolver=letsencrypt"
      # Traefik can infer this from EXPOSE, but stating it removes the guess.
      - "traefik.http.services.archiver.loadbalancer.server.port=80"

  # The learner-facing SPA (psc-archiver-client). Same shape as `web` — its own
  # nginx, its own /api proxy to the same api container, its own certificate.
  # Two SPAs cannot both own `/` behind one origin, which is why this is a
  # second hostname rather than a path prefix on the first.
  learner:
    image: ${LEARNER_IMAGE:-ghcr.io/mroshan74/psc-archiver-client}:${LEARNER_TAG:?LEARNER_TAG is not set in .env}
    container_name: psc-archiver-learner
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      # nginx's own static /healthz, not /api/readyz — this reports the learner
      # web tier, and must not go red merely because the api is down.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      # Router and service names must be unique across the whole Docker
      # provider, so this cannot reuse `archiver`.
      - "traefik.http.routers.learner.rule=Host(`${LEARNER_HOST:?LEARNER_HOST is not set in .env}`)"
      - "traefik.http.routers.learner.entrypoints=websecure"
      - "traefik.http.routers.learner.tls.certresolver=letsencrypt"
      - "traefik.http.services.learner.loadbalancer.server.port=80"

  # One-shot bootstrap for a fresh database, the production twin of the `seed`
  # service in compose.local.yml. Run it after the stack is up:
  #
  #   docker compose -f compose.prod.yml -p psc-archiver --profile seed run --rm seed
  #
  # It creates the System organization and the superadmin (straight to MongoDB),
  # waits for the api, then seeds the taxonomy and imports the bundled exam
  # papers and questions over the internal network. Nobody has to sign in or
  # call the API by hand. Idempotent, so it is safe to re-run.
  #
  # It does NOT clear anything. Starting a fresh MVP round means emptying the
  # Atlas database yourself first; there is no mongo container here to wipe.
  seed:
    profiles: [seed]
    # The same image the api service resolves, so the bootstrap always matches
    # the build that is actually deployed.
    image: ${API_IMAGE:-ghcr.io/mroshan74/psc-archiver-api}:${API_TAG:?API_TAG is not set in .env}
    # Supplies MONGODB_URI, SEED_SUPERADMIN_*, SEEDER_DATA_DIR — the same file
    # the api container runs on, so the two can never disagree about the database.
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:5000
      ADMIN_URL: https://${ADMIN_HOST:?ADMIN_HOST is not set in .env}
    volumes:
      - ./scripts/bootstrap.mjs:/bootstrap.mjs:ro
    command: ["node", "/bootstrap.mjs"]
    depends_on:
      - api
    # Load-bearing. This file has no default network, only the external
    # traefik_proxy the api sits on. Without this the container starts, fails to
    # resolve `api`, and times out 90s later with a message that looks like an
    # API fault rather than a networking one.
    networks:
      - traefik_proxy
    labels:
      # A one-shot container must never be routed.
      - "traefik.enable=false"

volumes:
  ai_tagging_jobs:
    name: psc-archiver-ai-tagging-jobs

networks:
  # Created and owned by the Traefik stack (compose.traefik.yml), which must
  # therefore be up before this one. Nothing creates it imperatively.
  traefik_proxy:
    external: true
