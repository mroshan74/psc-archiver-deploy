# Edge proxy + automatic TLS. This stack OWNS the traefik_proxy network that it
# and the app stack (compose.prod.yml) share — the network block below is not
# `external`, so bringing this up is what creates it. compose.prod.yml joins the
# same network as `external`, which is why Traefik has to come up first on a
# fresh server. Starting it is a deliberate manual step (it needs ACME_EMAIL,
# which nothing can ask for non-interactively), run once and then left alone;
# app deploys never touch this stack.
#
#   ACME_EMAIL=you@example.com docker compose -f compose.traefik.yml -p traefik up -d
#
# Because this stack owns the network, `down` here also removes it. Docker
# refuses while the app containers are still attached, which is the safe
# outcome — but stop the app stack first if you really mean to tear this down.

name: traefik

services:
  traefik:
    # Floating major-version tag, deliberately not pinned like the app images
    # are: this stack sits outside deploy.sh/rollback.sh's rollback trail, and
    # an old patch here can hard-fail against a newer host Docker Engine (its
    # bundled docker-client's API version negotiation can lag what the daemon
    # will accept — "client version ... too old" in `docker logs traefik` is
    # that failure). `docker compose pull traefik` picks up new patches.
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      # Everything is HTTPS; plain HTTP only ever redirects.
      - "--entryPoints.web.http.redirections.entrypoint.to=websecure"
      - "--entryPoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is not set}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
      # No dashboard port. The predecessor published 8080 for a dashboard that
      # `--api.insecure=false` never served.
    volumes:
      - letsencrypt:/letsencrypt
      # Read-only: Traefik only needs to watch container labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik_proxy

volumes:
  # Holds acme.json. Back this up — losing it means re-issuing certificates and
  # risking Let's Encrypt rate limits.
  letsencrypt:
    name: letsencrypt

networks:
  traefik_proxy:
    name: traefik_proxy
    driver: bridge
